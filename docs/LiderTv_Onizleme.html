    if(state.loading&&!state.items.length)content+='<div class="loader"><span class="spinner"></span><p>\u0130\u00e7erikler haz\u0131rlan\u0131yor...</p></div>';
    else if(!state.items.length)content+='<div class="empty">'+icon('search')+'<h2>Burada hen\u00fcz i\u00e7erik yok</h2><p>Aramay\u0131 veya klas\u00f6r se\u00e7imini de\u011fi\u015ftirin. Kilitli ve gizli klas\u00f6rler bu alana dahil edilmez.</p></div>';
    else content+=`<div class="grid${state.tab==='live'?' live':''}">${state.items.map(card).join('')}</div><div class="pagination">${button(icon('arrowleft')+'\u00d6nceki','previous','secondary',state.offset===0?'disabled':'')}<span>${num(state.offset+1)}\u2013${num(state.offset+state.items.length)} / ${num(state.total)}</span>${button('Sonraki'+icon('arrowright'),'next','secondary',state.next<0?'disabled':'')}</div>`;
  }
  $('#app').innerHTML=header+`<main class="main">${content}</main><nav class="nav" aria-label="Ana men\u00fc">${nav}</nav>`;
  $('.main').scrollTop=scroll;if(focused&&$('#searchInput')){const el=$('#searchInput');el.focus({preventScroll:true});try{el.setSelectionRange(selection,selection);}catch(e){}}
  if(document.body.classList.contains('tv')&&!focused&&!$('#overlay').children.length){const chosen=$(`.navitem[data-id="${state.tab}"]`);chosen?.focus({preventScroll:true});}
}
async function load(reset=false){if(state.tab==='settings'){render();return;}const token=++loadEpoch;state.loading=true;if(reset){state.offset=0;state.items=[];if($('.main'))$('.main').scrollTop=0;}render();
  try{const [list,groups]=await Promise.all([api('browse',{kind:currentKind(),sid:state.source,group:state.group,shelf:state.shelf,sort:state.sort,q:state.q,offset:state.offset,limit:48}),api('groups',{kind:currentKind(),sid:state.source})]);if(token!==loadEpoch)return;state.items=list.items;state.total=list.total;state.next=list.next;state.groups=groups;state.loading=false;render();}catch(e){if(token===loadEpoch){state.loading=false;render();toast(e.message);}}
}
async function navigate(tab){if(!labels[tab])return;closeModal();state.tab=tab;state.group='all';state.shelf='all';state.q='';state.search=tab==='home';state.offset=0;state.items=[];await load(true);}
function openModal(title,body,kind='generic'){if(!modalKind)returnFocus=document.activeElement;modalKind=kind;drawer=false;$('#overlay').innerHTML=`<div class="overlay-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h2>${esc(title)}</h2>${button(icon('close'),'close','iconbtn','aria-label="Kapat"')}</div>${body}</section></div>`;setTimeout(()=>$('#overlay .focusable')?.focus({preventScroll:true}),0);}

async function openDrawer(){state.groups=await api('groups',{kind:currentKind(),sid:state.source});returnFocus=document.activeElement;modalKind='drawer';drawer=true;$('#overlay').innerHTML=`<div class="drawer-wrap"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Klas\u00f6rler"><div class="row"><h2>Klas\u00f6rler</h2>${button(icon('close'),'close','iconbtn','aria-label="Kapat"')}</div>${specialChips()}<small>Ba\u015fl\u0131\u011fa uzun bas: s\u0131rala, sabitle, gizle veya kilitle. TV'de OK tu\u015funa uzun bas\u0131n ya da Men\u00fc tu\u015funu kullan\u0131n.</small>${state.groups.map(g=>button((g.locked?icon('lock'):g.pinned?icon('pin'):icon('movies'))+`<span class="grow">${esc(g.name)}</span>`+(g.hidden?'<small>Gizli</small>':''),'group',`chip category${g.hidden?' hidden':''}${state.group===g.id?' active':''}`,`data-id="${esc(g.id)}"`)).join('')}<small>Sola \u00e7ekerek veya geri tu\u015fuyla kapatabilirsiniz.</small></aside></div>`;setTimeout(()=>$('#overlay .focusable')?.focus(),0);}

function navMenu(id){openModal(labels[id],`<p class="muted">Telefonda uzun bas\u0131p s\u00fcr\u00fckleyin. Kumandada a\u015fa\u011f\u0131daki d\u00fc\u011fmeleri kullan\u0131n.</p><div class="modal-footer">${button(icon('arrowleft')+'Sola ta\u015f\u0131','moveNav','secondary',`data-id="${id}" data-delta="-1"`)}${button('Sa\u011fa ta\u015f\u0131'+icon('arrowright'),'moveNav','secondary',`data-id="${id}" data-delta="1"`)}</div>`,'navMenu');}

  openModal(i.kind==='series'?'Dizi bilgileri':i.kind==='live'?'Kanal bilgileri':'Film bilgileri',`<div class="details"><div>${poster(i)}</div><div><span class="badge">${esc(i.group)}</span><h1>${esc(i.title)}</h1><p class="cast">Oyuncular: ${esc(i.cast||'Sa\u011flay\u0131c\u0131 oyuncu bilgisi vermedi.')}</p><div class="modal-footer">${button(icon('play')+(resume?'Devam et \u00b7 '+time(i.pos):'Oynat'),'play','primary',`data-id="${esc(i.id)}"`)}${button(icon('favorites')+(i.favorite?'Favoriden \u00e7\u0131kar':'Favorilere ekle'),'favorite','secondary',`data-id="${esc(i.id)}"`)}</div>${resume?button('Ba\u015ftan oynat','play','secondary',`data-id="${esc(i.id)}" data-restart="true"`):''}<p class="description">${esc(i.plot||'Bu i\u00e7erik i\u00e7in a\u00e7\u0131klama sa\u011flanmad\u0131.')}</p><p class="cast">${i.added>0?'Kaynak tarihi: '+timestamp(i.added):'Cihazda ilk g\u00f6r\u00fclme: '+timestamp(i.seen)}</p></div></div>${i.metadataError?`<div class="notice">${esc(i.metadataError)} Kay\u0131tl\u0131 bilgiler g\u00f6steriliyor.</div>`:''}${i.episodes?.length?`<div class="section-label">B\u00f6l\u00fcmler</div>${i.episodes.map(ep=>button(`${esc(ep.title)}<small>${ep.pos>10000?time(ep.pos):'Oynat'}</small>`,'play','episode',`data-id="${esc(ep.id)}"`)).join('')}`:''}`,'details');

async function play(id,restart=false){if(NATIVE){await api('play',{id,restart});closeModal();return;}const i=await api('play',{id});playerPosition=restart?0:i.pos||0;playerDuration=i.duration||5400000;playerPaused=false;modalItem={...i,id};drawPlayer();clearInterval(playerTimer);playerTimer=setInterval(()=>{if(modalKind!=='player'||playerPaused)return;playerPosition=Math.min(playerDuration,playerPosition+1000);$('#demoRange').value=String(playerPosition);$('#demoTime').textContent=time(playerPosition)+' / '+time(playerDuration);api('progress',{id,pos:playerPosition,duration:playerDuration}).catch(()=>{});},1000);}
function drawPlayer(){openModal('\u00d6rnek oynatma',`<div class="demo-player">${icon('play')}<h2>${esc(modalItem.title)}</h2><p>GER\u00c7EK YAYIN YOK \u00b7 Bu alan yaln\u0131zca oynatma ak\u0131\u015f\u0131n\u0131 ve devam etme davran\u0131\u015f\u0131n\u0131 g\u00f6sterir.</p></div><input id="demoRange" class="range focusable" aria-label="\u00d6rnek izleme konumu" type="range" min="0" max="${playerDuration}" value="${playerPosition}"><p id="demoTime" class="muted">${time(playerPosition)} / ${time(playerDuration)}</p><div class="modal-footer">${button('-10 saniye','demoSeek','secondary','data-delta="-10000"')}${button(playerPaused?'Oynat':'Duraklat','demoPause','primary')}${button('+10 saniye','demoSeek','secondary','data-delta="10000"')}${button('Geri','playerClose')}</div>`,'player');}
function settingsPage(){const cards=[['source','Sa\u011flay\u0131c\u0131lar','M3U / Xtream kaynaklar\u0131, aktar\u0131m raporu ve g\u00fcncelleme','providers'],['screen','G\u00f6r\u00fcnt\u00fc ve oynatma','Telefon / TV, tema, oynat\u0131c\u0131 ve uyku zamanlay\u0131c\u0131s\u0131','display'],['lock','Ebeveyn denetimi','PIN, klas\u00f6r kilitleri ve ge\u00e7ici oturum eri\u015fimi','parental'],['clock','\u0130zleme ge\u00e7mi\u015fi','Son izlenenler ve kald\u0131\u011f\u0131n yerden devam etme','history'],['info','Meta veriler ve arama','Afi\u015f, a\u00e7\u0131klama ve oyuncu bilgisi kapsam\u0131','metadata'],['info','Hakk\u0131nda','S\u00fcr\u00fcm, lisans ve bu \u00f6rne\u011fin s\u0131n\u0131rlar\u0131','about']];return `<section class="settings"><div class="settings-title">${icon('settings')}<div><div class="eyebrow">L\u0130DERTV</div><h1>Ayarlar</h1></div></div>${cards.map(([ic,t,d,a])=>button(`${icon(ic)}<div><b>${t}</b><small>${d}</small></div><span class="arrow">\u203a</span>`,a,'setting-card')).join('')}<p class="muted" style="text-align:center;font-size:11px;margin-top:26px">LiderTv ${VERSION} \u00b7 ${NATIVE?'Android kaynak projesi':'Etkile\u015fimli taray\u0131c\u0131 \u00f6rne\u011fi'}</p></section>`;}

function toggle(title,key,on){return button(`<span>${title}</span><span class="switch"></span>`,'preference',`toggle${on?' on':''}`,`data-key="${key}" data-value="${!on}"`);}
function displaySettings(){const s=state.settings;openModal('G\u00f6r\u00fcnt\u00fc ve oynatma',`<div class="section-label">G\u00f6r\u00fcn\u00fcm</div><div class="setting-box">${radio('Otomatik cihaz alg\u0131lama','mode','auto',s.mode)}${radio('Telefon','mode','phone',s.mode)}${radio('TV / kumanda','mode','tv',s.mode)}<p>TV kutusu kendini telefon gibi tan\u0131t\u0131yorsa TV g\u00f6r\u00fcn\u00fcm\u00fcn\u00fc elle se\u00e7ebilirsiniz.</p></div><div class="section-label">Tema</div><div class="setting-box">${radio('Koyu','theme','dark',s.theme)}${radio('A\u00e7\u0131k','theme','light',s.theme)}</div><div class="section-label">Oynat\u0131c\u0131</div><div class="setting-box">${[['Otomatik (s\u0131rayla dene)','auto'],['Media3 ExoPlayer','exo'],['VLC \u2014 donan\u0131m h\u0131zland\u0131rma','vlc'],['VLC \u2014 yaz\u0131l\u0131m \u00e7\u00f6z\u00fcme','vlc_sw'],['Android MediaPlayer','platform'],['Harici oynat\u0131c\u0131','external']].map(([n,v])=>radio(n,'engine',v,s.engine)).join('')}${toggle('Hata olursa ba\u015fka oynat\u0131c\u0131 dene','fallback',s.fallback)}<p>${NATIVE?'Oynat\u0131c\u0131 de\u011fi\u015ftirme, kapal\u0131 yay\u0131n\u0131 veya eri\u015fim yetkisini d\u00fczeltmez.':'Bu HTML dosyas\u0131 yerel Android oynat\u0131c\u0131lar\u0131n\u0131 \u00e7al\u0131\u015ft\u0131rmaz. Se\u00e7enekler Android kaynak projesiyle e\u015fle\u015fir.'}</p></div><div class="section-label">Uyku zamanlay\u0131c\u0131s\u0131</div><div class="setting-box">${[0,15,30,45,60,90,120].map(v=>radio(v?v+' dakika':'Kapal\u0131','sleep',String(v),String(s.sleep))).join('')}<p>S\u00fcre, Android oynatma ekran\u0131 a\u00e7\u0131l\u0131nca ba\u015flar.</p></div>`,'display');}
function parental(){openModal('Ebeveyn denetimi',`<div class="section-label">PIN</div><div class="setting-box"><h3>${state.hasPin?'Ebeveyn PIN\u2019i etkin':'4-8 haneli PIN belirleyin'}</h3><p>${state.unlocked?'Bu oturumda kilitli klas\u00f6rlere eri\u015fim a\u00e7\u0131k.':'Kilitler T\u00fcm\u00fc, arama, favoriler, ge\u00e7mi\u015f ve oynatmada uygulan\u0131r.'}</p>${!state.hasPin||state.unlocked?field('Yeni PIN','newPin','password')+field('PIN tekrar','confirmPin','password')+button('PIN kaydet','savePin','primary'):field('PIN','unlockPin','password')+button('Bu oturum i\u00e7in kilitleri a\u00e7','unlock','primary')}${state.unlocked?'<div class="modal-footer">'+button('Oturumu kilitle','lock','secondary')+'</div>':''}</div><div class="notice">Klas\u00f6re uzun bas\u0131p \u201cEbeveyn kilidi koy\u201d se\u00e7ene\u011fini kullan\u0131n. Android uygulamas\u0131 arka plana ge\u00e7ti\u011finde oturum eri\u015fimi kapan\u0131r. Uygulama verilerini cihaz ayarlar\u0131ndan silebilen ki\u015fi bu yerel kilidi s\u0131f\u0131rlayabilir.</div>`,'parental');}
async function providers(){adopt(await api('boot'));openModal('Sa\u011flay\u0131c\u0131lar',`<div class="row">${button('M3U adresi ekle','addM3u','primary')}${button('Xtream hesab\u0131 ekle','addXtream')}${button('M3U dosyas\u0131 se\u00e7','pickFile')}</div><div class="notice">Kaynak g\u00fcncelleme yaln\u0131zca burada ve onayla yap\u0131l\u0131r. Ba\u015far\u0131s\u0131z g\u00fcncellemede mevcut liste korunur. Parola veya abonelik adresinizi sohbetten g\u00f6ndermeniz gerekmez.</div>${state.sources.map(s=>`<div class="setting-box"><h3>${esc(s.name)}</h3><p>${esc(s.type.toUpperCase())} \u00b7 ${timestamp(s.updated)}</p><div class="metricrow"><div class="metric"><b>${num(s.raw)}</b><small>Okunan kay\u0131t</small></div><div class="metric"><b>${num(s.unique)}</b><small>Benzersiz kay\u0131t</small></div><div class="metric"><b>${num(s.duplicates)}</b><small>Yinelenen</small></div></div><p>Atlanan: ${num(s.skipped)} \u00b7 T\u00fcr\u00fc tahmin edilen: ${num(s.inferred)}</p><div class="row">${s.type==='demo'?'':button('Kayna\u011f\u0131 g\u00fcncelle','refreshSource','secondary',`data-id="${esc(s.id)}"`)}${button(icon('trash')+'Kald\u0131r','deleteSource','danger',`data-id="${esc(s.id)}"`)}</div></div>`).join('')}${NATIVE?'':button('\u00d6rnek verileri s\u0131f\u0131rla','resetDemo','secondary')}`,'providers');}
function addSource(type){openModal(type==='xtream'?'Xtream hesab\u0131 ekle':'M3U kayna\u011f\u0131 ekle',field('Kaynak ad\u0131','sourceName','text','Kayna\u011f\u0131m')+field(type==='xtream'?'Sunucu adresi (varsa port dahil)':'M3U liste adresi','sourceUrl','url',type==='xtream'?'https://sunucu:port':'https://sunucu/liste.m3u')+(type==='xtream'?field('Kullan\u0131c\u0131 ad\u0131','sourceUser')+field('Parola','sourcePass','password'):'')+`<div class="notice">Yaln\u0131zca kullan\u0131m yetkiniz olan yay\u0131n kaynaklar\u0131n\u0131 ekleyin. Android taraf\u0131nda kaynak adresleri cihaz anahtar\u0131yla \u015fifrelenerek saklan\u0131r.</div><div class="modal-footer">${button('Vazge\u00e7','close')}${button('Ekle ve i\u00e7e aktar','submitSource','primary',`data-type="${type}"`)}</div>`,'sourceForm');}
async function runImport(spec){openModal('\u0130\u00e7e aktar\u0131l\u0131yor',`<div class="loader"><span class="spinner"></span><p id="importStatus">Kaynak okunuyor. Mevcut liste korunuyor.</p></div>${button('\u0130ptal et','cancelImport')}`,'import');try{await api('import',spec);adopt(await api('boot'));state.source='';state.group='all';state.tab='live';state.q='';closeModal();await load(true);toast('Aktar\u0131m tamamland\u0131. Ayr\u0131nt\u0131lar Sa\u011flay\u0131c\u0131lar ekran\u0131nda.');}catch(e){closeModal();toast(e.message);}}
async function preference(key,value){const v=key==='sleep'?Number(value):value==='true'?true:value==='false'?false:value;state.settings[key]=v;adopt(await api('settings',state.settings));render();displaySettings();}
async function handle(el){const a=el.dataset.action,id=el.dataset.id;
  switch(a){
    case 'tab':await navigate(id);break;
    case 'mode':state.settings.mode=document.body.classList.contains('tv')?'phone':'tv';adopt(await api('settings',state.settings));render();break;
    case 'search':if(state.tab==='settings')await navigate('home');state.search=true;render();$('#searchInput')?.focus();break;
    case 'clearSearch':state.q='';state.offset=0;await load();$('#searchInput')?.focus();break;
    case 'drawer':await openDrawer();break;
    case 'close':closeModal();break;
    case 'confirm':{const fn=confirmFn;confirmFn=null;closeModal();await fn?.();break;}
    case 'shelf':closeModal();state.group='all';state.shelf=el.dataset.shelf;await load(true);break;
    case 'group':{const g=state.groups.find(g=>g.id===id);if(g?.hidden){groupMenu(id);break;}if(g?.locked&&!state.unlocked){parental();break;}closeModal();state.group=id;state.shelf='all';await load(true);break;}
    case 'sort':if(state.shelf==='new'){toast('Son eklenen 50 ba\u015fl\u0131\u011f\u0131 daima en yenileri g\u00f6sterir. Di\u011fer s\u0131ralamalar T\u00fcm\u00fc alan\u0131ndad\u0131r.');break;}openModal('S\u0131ralama',Object.entries(sortNames).map(([v,n])=>button(n,'setSort',`radio${v===state.sort?' selected':''}`,`data-id="${v}"`)).join(''),'sort');break;
    case 'setSort':closeModal();state.sort=id;await load(true);break;
    case 'next':if(state.next>=0){state.offset=state.next;if($('.main'))$('.main').scrollTop=0;state.items=[];await load();}break;
    case 'previous':state.offset=Math.max(0,state.offset-48);state.items=[];if($('.main'))$('.main').scrollTop=0;await load();break;
    case 'item':if(el.dataset.kind==='live')await play(id);else await details(id);break;
    case 'play':await play(id,el.dataset.restart==='true');break;
    case 'favorite':await api('favorite',{id});await details(id);await load();break;
    case 'groupFlag':await api('groupAction',{id,action:el.dataset.flag,value:el.dataset.value==='true'});closeModal();state.group='all';adopt(await api('boot'));await load(true);break;
    case 'moveGroup':{const ids=state.groups.map(g=>g.id),i=ids.indexOf(id),j=i+Number(el.dataset.delta);if(i>=0&&j>=0&&j<ids.length){[ids[i],ids[j]]=[ids[j],ids[i]];await api('groupOrder',{ids});closeModal();await load();toast('Klas\u00f6r s\u0131ras\u0131 kaydedildi. Sabitlenen ba\u015fl\u0131klar \u00f6nce gelir.');}break;}
    case 'moveNav':{const n=state.settings.nav,i=n.indexOf(id),j=i+Number(el.dataset.delta);if(j>=0&&j<n.length){[n[i],n[j]]=[n[j],n[i]];adopt(await api('settings',state.settings));closeModal();render();}break;}
    case 'chooseSource':openModal('Kaynak se\u00e7',button('T\u00fcm kaynaklar','setSource','radio','data-id=""')+state.sources.map(s=>button(esc(s.name),'setSource','radio',`data-id="${esc(s.id)}"`)).join(''),'sources');break;
    case 'setSource':state.source=id;state.group='all';closeModal();await load(true);break;
    case 'providers':await providers();break;
    case 'display':displaySettings();break;
    case 'parental':parental();break;
    case 'preference':await preference(el.dataset.key,el.dataset.value);break;
    case 'savePin':{const pin=$('#newPin').value;if(pin!==$('#confirmPin').value)throw Error('PIN alanlar\u0131 e\u015fle\u015fmiyor.');adopt(await api('setPin',{pin}));parental();await load();toast('PIN kaydedildi.');break;}
    case 'unlock':adopt(await api('unlock',{pin:$('#unlockPin').value}));parental();await load();break;
    case 'lock':adopt(await api('lock'));parental();await load();break;
    case 'addM3u':addSource('m3u');break;
    case 'addXtream':addSource('xtream');break;
    case 'submitSource':{const spec={name:$('#sourceName').value.trim()||'Kayna\u011f\u0131m',url:$('#sourceUrl').value.trim(),type:el.dataset.type,user:$('#sourceUser')?.value||'',pass:$('#sourcePass')?.value||'',allowHttp:false};let u;try{u=new URL(spec.url);}catch(e){throw Error('Ge\u00e7erli bir kaynak adresi girin.');}if(!['http:','https:'].includes(u.protocol))throw Error('HTTP veya HTTPS adresi gerekli.');if(spec.type==='xtream'&&(!spec.user||!spec.pass))throw Error('Kullan\u0131c\u0131 ad\u0131 ve parola gerekli.');if(u.protocol==='http:')ask('HTTP ba\u011flant\u0131s\u0131','Bu kaynak \u015fifrelenmemi\u015f HTTP kullan\u0131yor. A\u011fdaki ba\u015fka ki\u015filer hesap ve yay\u0131n bilgilerini g\u00f6rebilir. Devam edilsin mi?',()=>runImport({...spec,allowHttp:true}));else await runImport(spec);break;}
    case 'pickFile':if(NATIVE)await api('file');else $('#fileInput').click();break;
    case 'refreshSource':ask('Kaynak g\u00fcncellensin mi?','T\u00fcm liste sunucudan tekrar okunacak. \u0130\u015flem tamamlanana kadar eski liste etkin kal\u0131r.',()=>runImport({id}));break;
    case 'deleteSource':ask('Kaynak kald\u0131r\u0131ls\u0131n m\u0131?','Bu kayna\u011f\u0131n i\u00e7erikleri, favorileri ve izleme ge\u00e7mi\u015fi bu cihazdan silinir.',async()=>{adopt(await api('deleteSource',{id}));state.source='';state.group='all';await providers();await load(true);});break;
    case 'cancelImport':if(NATIVE){await api('cancelImport');toast('\u0130ptal iste\u011fi al\u0131nd\u0131; mevcut a\u011f iste\u011fi kapan\u0131nca i\u015flem durur.');}break;
    case 'resetDemo':ask('\u00d6rnek veriler s\u0131f\u0131rlans\u0131n m\u0131?','Yaln\u0131zca bu taray\u0131c\u0131daki \u00f6rnek veriler s\u0131f\u0131rlan\u0131r.',async()=>{adopt(await api('resetDemo'));state.source='';await navigate('live');});break;
    case 'history':openModal('\u0130zleme ge\u00e7mi\u015fi',`<div class="setting-box"><h3>Bu cihazdaki izleme bilgileri</h3><p>Her b\u00f6l\u00fcmde \u201cSon izlenenler\u201d ba\u015fl\u0131\u011f\u0131 bulunur. Film ve dizilerde devam etme bilgisi cihazda saklan\u0131r. Telefon ile TV aras\u0131nda otomatik e\u015fitleme bu \u00f6rnekte yoktur.</p>${button('Ge\u00e7mi\u015fi temizle','clearHistory','danger')}</div>`,'history');break;
    case 'clearHistory':ask('Ge\u00e7mi\u015f temizlensin mi?','Son izlenenler ve devam etme konumlar\u0131 silinecek.',async()=>{await api('clearHistory');toast('Ge\u00e7mi\u015f temizlendi.');await load();});break;
    case 'metadata':openModal('Meta veriler ve arama','<div class="setting-box"><h3>Kaynak verisi esas al\u0131n\u0131r</h3><p>M3U / Xtream kayna\u011f\u0131n\u0131n verdi\u011fi afi\u015f, a\u00e7\u0131klama ve oyuncu alanlar\u0131 kullan\u0131l\u0131r. Xtream ayr\u0131nt\u0131s\u0131 a\u00e7\u0131lan filmin/dizinin oyuncu bilgisi yerel arama dizinine eklenir.</p><p>Genel arama ad ve mevcut oyuncu bilgisinde; b\u00f6l\u00fcm aramalar\u0131 sadece o b\u00f6l\u00fcmdeki adlarda \u00e7al\u0131\u015f\u0131r. B\u00fct\u00fcn katalo\u011fu oyuncular\u0131yla eksiksiz indeksleme ve TMDB entegrasyonu hen\u00fcz yoktur.</p><p>Kayna\u011f\u0131n t\u00fcr bilgisi yoksa M3U i\u00e7eri\u011fi kategori, adres ve dosya uzant\u0131s\u0131ndan tahmin edilir. Tahmin say\u0131s\u0131 aktar\u0131m raporunda g\u00f6r\u00fcn\u00fcr.</p></div>','metadata');break;
    case 'about':openModal('LiderTv '+VERSION,`<div class="setting-box"><h3>Telefon + TV i\u00e7in ilk \u00f6rnek</h3><p>Bu, M3UAndroid\u2019in t\u00fcm \u00f6zellikleri korunmu\u015f ve test edilmi\u015f nihai s\u00fcr\u00fcm\u00fc de\u011fildir. Yeni aray\u00fcz\u00fc, veri ak\u0131\u015f\u0131n\u0131 ve cihaz uyarlamas\u0131n\u0131 denemek i\u00e7in ayr\u0131 bir prototiptir.</p><p>Android kaynak kodu burada APK olarak derlenip POCO / Hiremco cihazlar\u0131nda test edilmedi. Paket i\u00e7inde kaynak kodu, derleme i\u015f ak\u0131\u015f\u0131 ve M3UAndroid'e yeni mod\u00fcl ekleyen ara\u00e7 bulunur.</p><p>Lisans: GPL-3.0-only. Oynat\u0131c\u0131 ba\u011f\u0131ml\u0131l\u0131klar\u0131n\u0131n kendi lisanslar\u0131 ge\u00e7erlidir. Haz\u0131r yay\u0131n listesi ve DRM a\u015fma mekanizmas\u0131 bulunmaz.</p>${button('Lisans metni','license','secondary')}</div>`,'about');break;
    case 'license':openModal('Lisans / GPL v3',`<pre class="license-text">${esc(window.LiderLicense||'LICENSE.txt')}</pre>`,'license');break;
    case 'demoPause':playerPaused=!playerPaused;el.textContent=playerPaused?'Oynat':'Duraklat';break;
    case 'demoSeek':playerPosition=Math.max(0,Math.min(playerDuration,playerPosition+Number(el.dataset.delta)));$('#demoRange').value=String(playerPosition);$('#demoTime').textContent=time(playerPosition)+' / '+time(playerDuration);await api('progress',{id:modalItem.id,pos:playerPosition,duration:playerDuration});break;
    case 'playerClose':await api('progress',{id:modalItem.id,pos:playerPosition,duration:playerDuration});closeModal();await load();break;
  }
}
let suppressClickUntil=0;
document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();return;}const el=e.target.closest('[data-action]');if(el&&!el.disabled)handle(el).catch(e=>toast(e.message));});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){state.q=e.target.value;state.offset=0;clearTimeout(searchTimer);searchTimer=setTimeout(()=>load(),260);}if(e.target.id==='demoRange'){playerPosition=Number(e.target.value);$('#demoTime').textContent=time(playerPosition)+' / '+time(playerDuration);api('progress',{id:modalItem.id,pos:playerPosition,duration:playerDuration}).catch(e=>toast(e.message));}});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.remove();},true);
$('#fileInput').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;adopt(await Demo.importFile(file));closeModal();state.source='';await navigate('live');toast('Dosya aktar\u0131ld\u0131; bu HTML \u00f6rne\u011fi yay\u0131n adreslerini oynatmaz veya saklamaz.');}catch(e){toast(e.message);}finally{$('#fileInput').value='';}});
// Gesture arbitration: edge drawer, center section swipe, top pull-to-search, long-press drag.
let gesture=null,longTimer=null,drag=null;
function longAction(el){if(!el||!el.classList)return;if(el.classList.contains('category'))groupMenu(el.dataset.id);else if(el.classList.contains('navitem'))navMenu(el.dataset.id);else if(el.classList.contains('card'))(el.dataset.kind==='live'?details(el.dataset.id):play(el.dataset.id)).catch(e=>toast(e.message));}
document.addEventListener('contextmenu',e=>{const el=e.target.closest('.category,.navitem,.card');if(el){e.preventDefault();longAction(el);}});
document.addEventListener('pointerdown',e=>{if(e.button!==0)return;const el=e.target.closest('.category,.navitem,.card');gesture={x:e.clientX,y:e.clientY,target:e.target,startScroll:$('.main')?.scrollTop||0,el};clearTimeout(longTimer);
  if(el)longTimer=setTimeout(()=>{suppressClickUntil=Date.now()+900;if(el.classList.contains('category')||el.classList.contains('navitem')){drag={el,container:el.parentElement,moved:false,selector:el.classList.contains('navitem')?'.navitem':'.category'};el.classList.add('long');toast('Yerini de\u011fi\u015ftirmek i\u00e7in s\u00fcr\u00fckleyin; se\u00e7enekler i\u00e7in b\u0131rak\u0131n.');}else{longAction(el);gesture=null;}},600);
});
document.addEventListener('pointermove',e=>{if(drag){const over=document.elementFromPoint(e.clientX,e.clientY)?.closest(drag.selector);if(over&&over!==drag.el&&over.parentElement===drag.container){const els=Array.from(drag.container.querySelectorAll(drag.selector)),a=els.indexOf(drag.el),b=els.indexOf(over);drag.container.insertBefore(drag.el,b>a?over.nextSibling:over);drag.moved=true;}return;}if(gesture&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>12)clearTimeout(longTimer);});
document.addEventListener('pointerup',e=>{clearTimeout(longTimer);if(drag){const d=drag;drag=null;gesture=null;d.el.classList.remove('long');suppressClickUntil=Date.now()+650;if(d.moved){const ids=Array.from(d.container.querySelectorAll(d.selector)).map(x=>x.dataset.id);if(d.selector==='.navitem'){state.settings.nav=ids;api('settings',state.settings).then(b=>{adopt(b);render();toast('Men\u00fc s\u0131ras\u0131 kaydedildi.');}).catch(e=>toast(e.message));}else{const hidden=state.groups.filter(g=>!ids.includes(g.id)).map(g=>g.id);api('groupOrder',{ids:[...ids,...hidden]}).then(()=>load()).catch(e=>toast(e.message));}}else longAction(d.el);return;}
  if(!gesture)return;const g=gesture;gesture=null;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(g.target.closest('input,.chips,.nav,.range'))return;
  if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5){suppressClickUntil=Date.now()+500;if(drawer){if(dx<0)closeModal();return;}if(modalKind)return;if(g.x<32&&dx>0){openDrawer().catch(e=>toast(e.message));return;}switchSection(dx<0?1:-1);}
  else if(dy>80&&Math.abs(dx)<55&&g.startScroll<5&&!modalKind&&state.tab!=='settings'){state.search=true;render();$('#searchInput')?.focus();suppressClickUntil=Date.now()+500;}
});
document.addEventListener('pointercancel',()=>{clearTimeout(longTimer);if(drag){drag.el.classList.remove('long');drag=null;render();}gesture=null;});
function switchSection(delta){const tabs=['live','movies','series'];const i=tabs.indexOf(state.tab);if(i>=0&&tabs[i+delta])navigate(tabs[i+delta]);}

// Prevent the browser's overscroll from swallowing the pull-to-search gesture.
let touchOrigin=null;
document.addEventListener('touchstart',e=>{const t=e.touches[0];touchOrigin=t?{x:t.clientX,y:t.clientY,top:($('.main')?.scrollTop||0)<5,target:e.target,done:false}:null;},{passive:true});
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];if(!t)return;
  if(drag){e.preventDefault();const over=document.elementFromPoint(t.clientX,t.clientY)?.closest(drag.selector);if(over&&over!==drag.el&&over.parentElement===drag.container){const els=Array.from(drag.container.querySelectorAll(drag.selector));drag.container.insertBefore(drag.el,els.indexOf(over)>els.indexOf(drag.el)?over.nextSibling:over);drag.moved=true;}return;}
  const g=touchOrigin;if(!g||g.done||!g.top||modalKind||state.tab==='settings'||g.target.closest('.chips,.nav,input'))return;
  const dx=t.clientX-g.x,dy=t.clientY-g.y;
  if(dy>10&&dy>Math.abs(dx)*1.5){e.preventDefault();clearTimeout(longTimer);if(dy>70){g.done=true;gesture=null;suppressClickUntil=Date.now()+700;state.search=true;render();}}
},{passive:false});
document.addEventListener('touchend',()=>{touchOrigin=null;},{passive:true});

// Spatial focus for a remote. No touch-only action is required.
function visibleFocusables(){const root=$('#overlay').children.length?$('#overlay'):$('#app');return Array.from(root.querySelectorAll('.focusable:not(:disabled),input:not([hidden])')).filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0;});}
function moveFocus(direction){const els=visibleFocusables();if(!els.length)return;const active=document.activeElement;if(active?.tagName==='INPUT'&&['text','search','password','url'].includes(active.type)&&['left','right'].includes(direction))return;
  if(!els.includes(active)){els[0].focus();return;}const a=active.getBoundingClientRect(),ax=a.x+a.width/2,ay=a.y+a.height/2;let best=null,score=Infinity;
  for(const el of els){if(el===active)continue;const b=el.getBoundingClientRect(),dx=b.x+b.width/2-ax,dy=b.y+b.height/2-ay;const primary=direction==='left'?-dx:direction==='right'?dx:direction==='up'?-dy:dy,secondary=['left','right'].includes(direction)?Math.abs(dy):Math.abs(dx);if(primary<5)continue;const s=primary+secondary*2.3;if(s<score){score=s;best=el;}}
  if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});}else if(direction==='left'&&!modalKind)openDrawer().catch(e=>toast(e.message));
}
let okTimer=null,okLong=false;
function remoteKey(code,action=0,repeat=0){if(code===23||code===66){if(action===0&&repeat===0){okLong=false;okTimer=setTimeout(()=>{okLong=true;longAction(document.activeElement);},650);}else if(action===1){clearTimeout(okTimer);if(!okLong)document.activeElement?.click();}return;}
  if(action!==0)return;if([19,20,21,22].includes(code)){moveFocus({19:'up',20:'down',21:'left',22:'right'}[code]);return;}if(code===82){longAction(document.activeElement);return;}if(code===84){state.search=true;render();$('#searchInput')?.focus();return;}if(code===92)switchSection(-1);if(code===93)switchSection(1);
}
function back(){if(modalKind){closeModal();load();return true;}if(state.search&&state.tab!=='home'){state.search=false;state.q='';load(true);return true;}if(state.tab!=='live'){navigate('live');return true;}return false;}
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&modalKind){const els=visibleFocusables();const i=els.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();els[els.length-1]?.focus();}else if(!e.shiftKey&&i===els.length-1){e.preventDefault();els[0]?.focus();}return;}if(e.key==='Escape'){e.preventDefault();back();return;}if(NATIVE)return;if(e.target.tagName==='INPUT')return;const k={ArrowUp:19,ArrowDown:20,ArrowLeft:21,ArrowRight:22,Enter:23,PageUp:92,PageDown:93,ContextMenu:82}[e.key];if(k){e.preventDefault();remoteKey(k,0,e.repeat?1:0);}});
document.addEventListener('keyup',e=>{if(!NATIVE&&e.key==='Enter'&&e.target.tagName!=='INPUT'){e.preventDefault();remoteKey(23,1);}});
async function refresh(){if(!state.loaded)return;const before=state.unlocked;adopt(await api('boot'));if(before&&!state.unlocked)closeModal();await load();}
window.Lider={back,key:remoteKey,refresh,event:async(name,data)=>{if(name==='importProgress'&&$('#importStatus'))$('#importStatus').textContent=num(data.records)+' kay\u0131t okundu...';if(name==='error')toast(data.message);if(name==='importDone'){adopt(await api('boot'));closeModal();await navigate('live');toast('Dosya aktar\u0131m\u0131 tamamland\u0131.');}}};
api('boot').then(b=>{adopt(b);state.tab=state.sources.length===1?'live':'home';state.search=state.tab==='home';state.loaded=true;return load(true);}).catch(e=>{$('#app').innerHTML='<main class="main"><h1>LiderTv</h1><p>'+esc(e.message)+'</p></main>';});
})();
</script></body></html>
