name: LiderTv Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Java 17 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: SDK kontrol
        run: |
          sdkmanager --version
          adb version
          yes | sdkmanager --licenses > /dev/null || true

      - name: Gradle 8.11.1 kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Gradle sürümünü kontrol et
        run: gradle --version

      - name: APK derle
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: APK paketle
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/LiderTv_0.2.0_Telefon_TV.apk
          cd output
          sha256sum LiderTv_0.2.0_Telefon_TV.apk > SHA256SUMS.txt

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: LiderTv_0.2.0_Telefon_TV_Deneme
          path: output/
          if-no-files-found: error
