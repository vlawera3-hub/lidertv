name: LiderTv Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Java 17 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: SDK kontrol
        run: |
          sdkmanager --version
          adb version
          yes | sdkmanager --licenses > /dev/null || true

        - name: Gradle ile APK derle
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: APK paketle
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/LiderTv_0.1.0_Telefon_TV.apk
          cd output
          sha256sum LiderTv_0.1.0_Telefon_TV.apk > SHA256SUMS.txt

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: LiderTv_0.1.0_Telefon_TV_Deneme
          path: output/
          if-no-files-found: error
